<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Admin</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#0a051e; color:#fff; min-height:100vh; }
.nav { background:rgba(0,0,0,0.8); padding:20px 40px; display:flex; justify-content:space-between; align-items:center; position:fixed; top:0; width:100%; z-index:1000; backdrop-filter:blur(10px); }
.logo { font-size:24px; font-weight:bold; color:#ff0000; text-shadow:0 0 20px #ff0000; }
.nav a { color:#fff; text-decoration:none; margin-left:25px; font-size:15px; }
.nav a:hover { color:#ff0000; }
.container { max-width:600px; margin:120px auto 40px; padding:30px; background:rgba(20,10,40,0.8); border-radius:15px; border:1px solid #ff0000; }
h2 { color:#ff0000; text-align:center; margin-bottom:25px; }
input, textarea { width:100%; padding:14px; margin-bottom:15px; background:#0a051e; border:1px solid #ff0000; border-radius:8px; color:#fff; }
input:focus, textarea:focus { outline:none; border-color:#cc0000; box-shadow:0 0 10px #ff0000; }
textarea { min-height:100px; resize:vertical; }
.btn { width:100%; padding:14px; background:linear-gradient(135deg,#ff0000,#990000); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:16px; font-weight:bold; }
.btn:hover { box-shadow:0 0 20px #ff0000; }
.flash { padding:12px; margin-bottom:15px; border-radius:8px; text-align:center; background:rgba(34,197,94,0.2); color:#4ade80; border:1px solid #4ade80; }
</style>
</head>
<body>
<div class="nav">
<div class="logo">PHANTOM ROLEPLAY</div>
<div><a href="/">Home</a><a href="/apply-admin">Apply Admin</a></div>
</div>
<div class="container">
<h2>👑 Apply for Admin</h2>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, msg in messages %}
<div class="flash">{{ msg }}</div>
{% endfor %}
{% endif %}
{% endwith %}
<form method="POST">
<input type="text" name="name" placeholder="Your Full Name" required>
<input type="number" name="age" placeholder="Your Age" min="13" max="99" required>
<input type="text" name="discord" placeholder="Discord Username" required>
<textarea name="experience" placeholder="Your experience (previous servers, skills, etc.)" required></textarea>
<input type="number" name="hours" placeholder="Hours you can play per day" min="1" max="24" required>
<button type="submit" class="btn">Submit Application</button>
</form>
</div>
</body>
</html>

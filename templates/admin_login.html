<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - PHANTOM</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#0a051e; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; }
.box { background:rgba(20,10,40,0.9); padding:40px; border-radius:15px; width:100%; max-width:400px; border:2px solid #ff0000; box-shadow:0 0 30px rgba(255,0,0,0.3); }
h2 { color:#ff0000; text-align:center; margin-bottom:25px; text-shadow:0 0 20px #ff0000; }
input { width:100%; padding:14px; margin-bottom:15px; background:#0a051e; border:1px solid #ff0000; border-radius:8px; color:#fff; }
input:focus { outline:none; border-color:#cc0000; box-shadow:0 0 10px #ff0000; }
.btn { width:100%; padding:14px; background:linear-gradient(135deg,#ff0000,#990000); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:16px; font-weight:bold; }
.btn:hover { box-shadow:0 0 20px #ff0000; }
.flash { padding:12px; margin-bottom:15px; border-radius:8px; text-align:center; background:rgba(239,68,68,0.2); color:#f87171; border:1px solid #f87171; }
</style>
</head>
<body>
<div class="box">
<h2>🔐 Admin Login</h2>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, msg in messages %}
<div class="flash">{{ msg }}</div>
{% endfor %}
{% endif %}
{% endwith %}
<form method="POST">
<input type="password" name="password" placeholder="Password" required>
<button type="submit" class="btn">Login</button>
</form>
</div>
</body>
</html>
